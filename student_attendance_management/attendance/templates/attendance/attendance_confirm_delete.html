{% extends 'base.html' %}
{% block title %}Delete Attendance - Attendance System{% endblock %}

{% block content %}
<h2 class="mb-3">Delete Attendance Record</h2>

<div class="card p-4" style="max-width: 560px;">
    <p>
        Delete the attendance record for <strong>{{ record.student.name }}</strong>
        on <strong>{{ record.date }}</strong> (status: {{ record.status }})?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'attendance_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
